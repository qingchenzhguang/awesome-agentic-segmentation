<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Agent loop: plan, call tools, inspect mask, refine, then feed the mask back">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="218" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <rect x="333" y="44" width="120" height="56" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="393" y="78" fill="#0969da">Plan</text>

    <rect x="471" y="44" width="120" height="56" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="531" y="78" fill="#1a7f37">Call tools</text>

    <rect x="609" y="44" width="120" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="669" y="78" fill="#7d4e00">Inspect mask</text>

    <rect x="747" y="44" width="120" height="56" rx="10" fill="#fbefff" stroke="#c297ff"/>
    <text x="807" y="78" fill="#8250df">Refine</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <line x1="457" y1="72" x2="465" y2="72" marker-end="url(#arrow)"/>
    <line x1="595" y1="72" x2="603" y2="72" marker-end="url(#arrow)"/>
    <line x1="733" y1="72" x2="741" y2="72" marker-end="url(#arrow)"/>
  </g>

  <path d="M807 102 C807 152 393 152 393 102" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-loop)"/>
  <text x="600" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8250df">feedback from the returned mask shapes the next action</text>
</svg>
